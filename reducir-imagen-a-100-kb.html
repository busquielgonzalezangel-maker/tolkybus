<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reducir Imagen a 100 KB Online Gratis - TOLKYBUS</title>
  <meta name="description" content="Comprime y reduce el peso de tus imágenes JPG y PNG a menos de 100 KB manteniendo la calidad. Herramienta online sin registros para formularios y trámites.">
  <link rel="canonical" href="https://tolkybus.com/reducir-imagen-a-100-kb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Navbar idéntico -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center">
    <a href="/" class="text-2xl font-black text-indigo-600">TOLKYBUS</a>
    <a href="/" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">← Volver al Inicio</a>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-4">Reducir Imagen a 100 KB Gratis</h1>
    <p class="text-slate-600 mb-8">Ajusta el peso de tus fotos para cumplir con los límites estrictos de subida en trámites estatales, exámenes o becas.</p>

    <!-- Zona de carga configurada para objetivo 100KB -->
    <div class="bg-white p-8 rounded-2xl border-2 border-dashed border-indigo-300 text-center shadow-lg">
      <i data-lucide="file-check" class="w-12 h-12 text-indigo-600 mx-auto mb-4"></i>
      <p class="font-bold text-lg mb-2">Selecciona la imagen a comprimir a 100 KB</p>
      <input type="file" class="mt-4 mx-auto block text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
